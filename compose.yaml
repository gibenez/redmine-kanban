services:
  sprint-board:
    build: .
    ports:
      - "${BOARD_PORT:-8080}:8080"
    environment:
      REDMINE_URL: ${REDMINE_URL:?Set your Redmine instance URL in .env}
      BACKLOG_STATUS_ID: ${BACKLOG_STATUS_ID:?Set the New status ID in .env}
      COLUMN_STATUS_IDS: ${COLUMN_STATUS_IDS:?Set ordered column status IDs in .env}
      REFRESH_SECONDS: ${REFRESH_SECONDS:-60}
    restart: unless-stopped

  # Local development only: Vite with live reload. Started by ./dev.sh.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:${DEV_PORT:-5173}:5173"
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: sync+restart
          path: ./vite.config.js
          target: /app/vite.config.js
        - action: rebuild
          path: ./package-lock.json
